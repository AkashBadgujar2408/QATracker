<app-auth-card heading="Sign in" subheading="Use the user name your administrator gave you.">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-1">
    @if (error()) {
      <div
        role="alert"
        class="mb-3 rounded-control border border-severity-critical/40 bg-severity-critical/10 px-3 py-2 text-sm text-text"
      >
        {{ error() }}
      </div>
    }

    <mat-form-field appearance="outline">
      <mat-label>User name</mat-label>
      <input
        matInput
        formControlName="userName"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        cdkFocusInitial
      />
      <mat-error>{{ fieldError(form.controls.userName, 'User name') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        formControlName="password"
        [type]="showPassword() ? 'text' : 'password'"
        autocomplete="current-password"
      />
      <button
        matIconButton
        matSuffix
        type="button"
        (click)="showPassword.set(!showPassword())"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" size="18" />
      </button>
      <mat-error>{{ fieldError(form.controls.password, 'Password') }}</mat-error>
    </mat-form-field>

    <mat-checkbox formControlName="rememberMe" class="-ml-2 mb-4">Remember me</mat-checkbox>

    <button matButton="filled" type="submit" class="w-full" [disabled]="busy()">
      @if (busy()) {
        <mat-progress-spinner mode="indeterminate" diameter="18" class="mr-2 inline-block" />
      }
      Sign in
    </button>
  </form>
</app-auth-card>
