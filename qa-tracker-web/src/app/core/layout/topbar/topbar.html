<form
  class="relative flex w-full max-w-md items-center"
  role="search"
  (submit)="search($event, query)"
>
  <label for="qa-global-search" class="sr-only">Search issues</label>
  <ng-icon
    name="lucideSearch"
    size="16"
    class="pointer-events-none absolute left-3 text-muted"
    aria-hidden="true"
  />
  <input
    #query
    id="qa-global-search"
    type="search"
    enterkeyhint="search"
    autocomplete="off"
    class="h-9 w-full rounded-control border border-border bg-bg pl-9 pr-10 text-sm text-text outline-none placeholder:text-muted focus:border-primary"
    placeholder="Search issue key or text…"
    (keydown.escape)="query.blur()"
  />
  <kbd
    class="pointer-events-none absolute right-2 rounded-control border border-border bg-surface-muted px-1.5 text-xs leading-5 text-muted"
    aria-hidden="true"
    >/</kbd
  >
</form>
<div class="ml-auto flex items-center gap-1">
  <button
    matIconButton
    type="button"
    (click)="theme.toggle()"
    [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    [matTooltip]="theme.mode() === 'dark' ? 'Light theme' : 'Dark theme'"
  >
    <ng-icon [name]="theme.mode() === 'dark' ? 'lucideSun' : 'lucideMoon'" size="20" />
  </button>

  <app-notification-bell />

  <button
    type="button"
    class="ml-1 flex cursor-pointer items-center rounded-full border-0 bg-transparent p-1 hover:bg-surface-muted"
    [matMenuTriggerFor]="userMenu"
  >
    <app-user-avatar
      aria-hidden="true"
      [name]="auth.user()?.fullName ?? '?'"
      [color]="auth.user()?.avatarColor ?? null"
      size="sm"
    />
    <span class="sr-only">User menu, {{ auth.user()?.fullName }}</span>
  </button>

  <mat-menu #userMenu="matMenu" xPosition="before">
    <div class="px-4 py-2">
      <div class="text-sm font-semibold text-text">{{ auth.user()?.fullName }}</div>
      <div class="text-xs text-muted">{{ auth.user()?.userName }} · {{ auth.user()?.role }}</div>
    </div>
    <mat-divider />
    <a mat-menu-item routerLink="/settings/notifications">
      <ng-icon name="lucideBellRing" size="16" class="mr-3" />
      <span>Notification settings</span>
    </a>
    <button mat-menu-item (click)="shortcuts.openHelp()">
      <ng-icon name="lucideKeyboard" size="16" class="mr-3" />
      <span>Keyboard shortcuts</span>
      <kbd class="ml-auto pl-4 text-xs text-muted" aria-hidden="true">?</kbd>
    </button>
    <a mat-menu-item routerLink="/change-password">
      <ng-icon name="lucideKeyRound" size="16" class="mr-3" />
      <span>Change password</span>
    </a>
    <button mat-menu-item (click)="auth.logout()">
      <ng-icon name="lucideLogOut" size="16" class="mr-3" />
      <span>Sign out</span>
    </button>
  </mat-menu>
</div>
