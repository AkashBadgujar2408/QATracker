<div class="brand flex shrink-0 items-center gap-3 px-4">
  <app-logo [size]="30" />
  @if (!collapsed()) {
    <span class="truncate text-md font-semibold tracking-tight">QA Tracker</span>
  }
</div>

<nav class="flex-1 overflow-y-auto overflow-x-hidden p-2" aria-label="Main">
  <ul class="m-0 flex list-none flex-col gap-0.5 p-0">
    @for (item of items(); track item.link) {
      <li>
        @if (item.children && !collapsed()) {
          <button
            type="button"
            class="nav-link w-full"
            [attr.aria-expanded]="openGroups().has(item.link)"
            (click)="toggleGroup(item.link)"
          >
            <ng-icon [name]="item.icon" size="18" aria-hidden="true" />
            <span class="flex-1 truncate text-left">{{ item.label }}</span>
            <ng-icon
              name="lucideChevronDown"
              size="16"
              aria-hidden="true"
              class="chevron"
              [class.-rotate-90]="!openGroups().has(item.link)"
            />
          </button>
          <!-- Always rendered so it can animate; inert (unfocusable) while closed. -->
          <div
            class="submenu"
            [class.open]="openGroups().has(item.link)"
            [attr.inert]="openGroups().has(item.link) ? null : ''"
          >
            <ul class="m-0 list-none p-0">
              @for (child of item.children; track child.link) {
                <li>
                  <a
                    class="nav-link nav-child"
                    [routerLink]="child.link"
                    routerLinkActive="active"
                    ariaCurrentWhenActive="page"
                    >{{ child.label }}</a
                  >
                </li>
              }
            </ul>
          </div>
        } @else {
          <a
            class="nav-link"
            [class.justify-center]="collapsed()"
            [routerLink]="item.children ? item.children[0].link : item.link"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: false }"
            ariaCurrentWhenActive="page"
            [matTooltip]="collapsed() ? item.label : ''"
            matTooltipPosition="right"
            [attr.aria-label]="collapsed() ? item.label : null"
          >
            <ng-icon [name]="item.icon" size="18" aria-hidden="true" />
            @if (!collapsed()) {
              <span class="truncate">{{ item.label }}</span>
            }
          </a>
        }
      </li>
    }
  </ul>
</nav>

<div class="footer shrink-0 p-2">
  <button
    type="button"
    class="nav-link w-full"
    [class.justify-center]="collapsed()"
    (click)="toggleCollapsed.emit()"
    [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    [matTooltip]="collapsed() ? 'Expand sidebar' : ''"
    matTooltipPosition="right"
  >
    <ng-icon
      [name]="collapsed() ? 'lucidePanelLeftOpen' : 'lucidePanelLeftClose'"
      size="18"
      aria-hidden="true"
    />
    @if (!collapsed()) {
      <span>Collapse</span>
    }
  </button>
</div>
