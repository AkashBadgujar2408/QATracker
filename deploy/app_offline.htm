<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Tracker – updating</title>
  <style>
    :root { color-scheme: light dark; --bg: #f8fafc; --ink: #0f172a; --muted: #475569; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --ink: #e2e8f0; --muted: #94a3b8; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; padding: 0 16px; text-align: center; }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>QA Tracker is being updated</h1>
    <p>This takes a minute or two. Reload the page shortly – nothing you saved is lost.</p>
  </main>
</body>
</html>
